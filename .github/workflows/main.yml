name: Build Phong Thuy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto extract zip if needed
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -x ".github/*"
            fi
          fi
          if [ ! -f "package.json" ]; then
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              cp -r "$(dirname "$PKG_PATH")"/* .
            fi
          fi
          if [ ! -f "package.json" ]; then
            echo "ERROR: Chua tai file phong-thuy-tong-hop-apk.zip len tab Code!"
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0f0f0f' --iconBackgroundColorDark '#0f0f0f' --splashBackgroundColor '#0f0f0f' --splashBackgroundColorDark '#0f0f0f'

      - name: Sync web app
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Phong-Thuy-Tong-Hop-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phong-Thuy-Tong-Hop-APK
          path: release-apk/Phong-Thuy-Tong-Hop-v1.0.apk

